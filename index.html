<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro Pro 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#000;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family: Georgia, serif;
}

/* 🌌 CANVAS FONDO */
canvas{
  position:absolute;
  top:0;left:0;
  width:100%;
  height:100%;
  z-index:0;
}

/* 📖 CONTENEDOR */
.book{
  width:90vw;
  max-width:420px;
  height:600px;
  position:relative;
  perspective:2000px;
  z-index:2;
}

/* 📄 HOJAS */
.page{
  position:absolute;
  width:100%;
  height:100%;
  transform-origin:left;
  transform-style:preserve-3d;
  transition:transform 1s;
}

/* CARA */
.face{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border-radius:10px;
  overflow:hidden;
}

/* FRENTE */
.front{
  background:
    repeating-linear-gradient(0deg,rgba(120,90,60,0.2) 0px,rgba(120,90,60,0.2) 1px,transparent 1px,transparent 28px),
    repeating-linear-gradient(90deg,rgba(120,90,60,0.1) 0px,rgba(120,90,60,0.1) 1px,transparent 1px,transparent 28px),
    linear-gradient(135deg,#f5e6c8,#e6d3a3);
}

/* ATRÁS */
.back{
  background:
    repeating-linear-gradient(0deg,rgba(120,90,60,0.2) 0px,rgba(120,90,60,0.2) 1px,transparent 1px,transparent 28px),
    repeating-linear-gradient(90deg,rgba(120,90,60,0.1) 0px,rgba(120,90,60,0.1) 1px,transparent 1px,transparent 28px),
    linear-gradient(135deg,#f5e6c8,#e6d3a3);
  transform:rotateY(180deg);
}

/* 📖 VOLTEO */
.page.flipped{
  transform:rotateY(-180deg);
}

/* 📸 FOTO */
.photo{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ✍️ TEXTO */
.content{
  padding:25px;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

h2{
  text-align:center;
  color:#5a2d0c;
  margin-bottom:10px;
}

.text{
  font-style:italic;
  line-height:1.8;
  color:#3b2a1a;
  text-align:justify;
}

/* ✨ RESALTADO */
.highlight{
  color:#b22222;
  font-weight:bold;
  font-style:normal;
}

/* BOTONES */
.controls{
  position:absolute;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 15px;
}

button{
  background:#5a2d0c;
  color:#fff;
  border:none;
  padding:8px 18px;
  border-radius:20px;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="book" id="book">

<!-- HOJA 1 -->
<div class="page">
  <div class="face front">
    <img src="Foto1.jpg" class="photo">
  </div>
  <div class="face back">
    <div class="content">
      <h2>Perdón</h2>
      <p class="text">
        <span class="highlight">Te extraño</span> y quiero que me perdones...
        lo que dije era <span class="highlight">mentira</span>.
      </p>
    </div>
  </div>
</div>

<!-- HOJA 2 -->
<div class="page">
  <div class="face front">
    <img src="Foto2.jpg" class="photo">
  </div>
  <div class="face back">
    <div class="content">
      <h2>Nosotros</h2>
      <p class="text">
        Desde chicos...
        <span class="highlight">siempre juntos</span> 💖
      </p>
    </div>
  </div>
</div>

</div>

<div class="controls">
  <button onclick="prev()">←</button>
  <button onclick="next()">→</button>
</div>

<audio id="music" loop>
  <source src="musica.mp3">
</audio>

<script>
/* 📖 CONTROL HOJAS */
let pages = document.querySelectorAll(".page");
let current = 0;
let music = document.getElementById("music");

function next(){
  if(current < pages.length){
    pages[current].classList.add("flipped");
    current++;
    if(current==1) music.play().catch(()=>{});
  }
}

function prev(){
  if(current > 0){
    current--;
    pages[current].classList.remove("flipped");
  }
}

/* 📱 SWIPE */
let startX=0;
document.addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
});
document.addEventListener("touchend",e=>{
  let endX=e.changedTouches[0].clientX;
  if(startX-endX>50) next();
  if(endX-startX>50) prev();
});

/* 🍫 PARTÍCULAS */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

const emojis=["❤️","🍫","🍬","🍭","💖"];
let particles=[];

class P{
  constructor(){
    this.x=Math.random()*canvas.width;
    this.y=Math.random()*canvas.height;
    this.size=Math.random()*25+15;
    this.speed=Math.random()*2+1;
    this.emoji=emojis[Math.floor(Math.random()*emojis.length)];
  }
  update(){
    this.y+=this.speed;
    if(this.y>canvas.height) this.y=0;
  }
  draw(){
    ctx.font=this.size+"px Arial";
    ctx.fillText(this.emoji,this.x,this.y);
  }
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(particles.length<40) particles.push(new P());
  particles.forEach(p=>{p.update();p.draw();});
  requestAnimationFrame(animate);
}
animate();

window.onresize=()=>{
  canvas.width=innerWidth;
  canvas.height=innerHeight;
};
</script>

</body>
</html>
