<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#000;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:'Segoe UI',sans-serif;
}

/* 🌌 Fondo animado */
canvas{
  position:absolute;
  width:100%;
  height:100%;
  z-index:0;
}

/* 📖 LIBRO */
.book{
  width:95vw;
  max-width:500px;
  height:90vh;
  max-height:650px;
  display:flex;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 20px 40px rgba(0,0,0,0.7);
  z-index:2;
}

/* 📸 LADO IZQUIERDO */
.left{
  width:50%;
  height:100%;
  background:#000;
}

.left img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* 📜 LADO DERECHO (HOJA) */
.right{
  width:50%;
  height:100%;
  padding:20px;
  overflow-y:auto;

  background:
    repeating-linear-gradient(0deg,rgba(120,90,60,0.2) 0px,rgba(120,90,60,0.2) 1px,transparent 1px,transparent 28px),
    repeating-linear-gradient(90deg,rgba(120,90,60,0.1) 0px,rgba(120,90,60,0.1) 1px,transparent 1px,transparent 28px),
    linear-gradient(135deg,#f5e6c8,#e6d3a3);
}

/* ✍️ TEXTO */
h2{
  text-align:center;
  color:#5a2d0c;
  margin-bottom:10px;
}

.text{
  font-style:italic;
  line-height:1.8;
  color:#3b2a1a;
  font-size:1.05em;
}

/* ✨ RESALTADOS */
.highlight{
  color:#b22222;
  font-weight:bold;
  font-style:normal;
}

/* BOTONES */
.controls{
  position:absolute;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 15px;
  z-index:3;
}

button{
  background:#5a2d0c;
  color:#fff;
  border:none;
  padding:10px 18px;
  border-radius:20px;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<!-- 📖 LIBRO -->
<div class="book">

  <!-- IZQUIERDA FOTO -->
  <div class="left">
    <img src="Foto1.jpg">
  </div>

  <!-- DERECHA TEXTO -->
  <div class="right">
    <h2>Perdón</h2>
    <p class="text">
      <span class="highlight">Te extraño</span> y quiero que me perdones,
      sé que soy un pelotudo... pero lo que te dije era
      <span class="highlight">todo mentira</span>.
      <br><br>
      Me duele que lo hayas tomado en serio y de verdad
      te pido perdón 💔
      <br><br>
      Te conozco desde los 5 años y nunca nos separamos,
      <span class="highlight">sos muy importante para mí</span>.
    </p>
  </div>

</div>

<div class="controls">
  <button onclick="alert('Podés agregar más páginas después')">←</button>
  <button onclick="alert('Después te hago las páginas animadas bien')">→</button>
</div>

<audio autoplay loop>
  <source src="musica.mp3">
</audio>

<script>
/* 🍫 PARTÍCULAS */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

const emojis=["❤️","🍫","🍬","🍭"];
let particles=[];

class P{
  constructor(){
    this.x=Math.random()*canvas.width;
    this.y=Math.random()*canvas.height;
    this.size=Math.random()*20+15;
    this.speed=Math.random()*2+1;
    this.emoji=emojis[Math.floor(Math.random()*emojis.length)];
  }
  update(){
    this.y+=this.speed;
    if(this.y>canvas.height) this.y=0;
  }
  draw(){
    ctx.font=this.size+"px Arial";
    ctx.fillText(this.emoji,this.x,this.y);
  }
}

function anim(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(particles.length<40) particles.push(new P());
  particles.forEach(p=>{p.update();p.draw();});
  requestAnimationFrame(anim);
}
anim();
</script>

</body>
</html>
